<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑丝 · 白丝 · 高清壁纸</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #b8966b;
            --gold-light: #d6b98d;
            --bg: #090909;
            --card: #151515;
            --border: #292929;
            --text: #eeeeee;
            --muted: #888;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
            background: radial-gradient(circle at 30% 10%, #202020 0%, #0b0b0b 35%, #050505 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 18px 0 22px;
            margin-bottom: 24px;
            border-bottom: 1px solid #292929;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #f5ead9, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            color: #777;
            font-size: 12px;
            letter-spacing: 3px;
            border-left: 1px solid #444;
            padding-left: 14px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls button,
        .controls label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid #414141;
            background: #171717;
            color: #ddd;
            font-size: 13px;
            letter-spacing: 1px;
            transition: .25s;
        }

        .controls button {
            cursor: pointer;
        }

        .controls button:hover {
            color: white;
            border-color: var(--gold);
            background: #242424;
        }

        .controls button.loading {
            pointer-events: none;
            opacity: .65;
        }

        .controls button.loading i {
            animation: spin .8s linear infinite;
        }

        .controls label {
            cursor: pointer;
            user-select: none;
        }

        .controls input {
            width: 16px;
            height: 16px;
            accent-color: var(--gold);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .category-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            padding-bottom: 12px;
            border-bottom: 1px solid #222;
            overflow-x: auto;
        }

        .tab {
            flex-shrink: 0;
            padding: 8px 28px;
            border-radius: 40px;
            border: 1px solid #333;
            background: #171717;
            color: #999;
            font-size: 15px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: .25s;
            font-family: inherit;
        }

        .tab:hover {
            color: white;
            border-color: var(--gold);
        }

        .tab.active {
            background: var(--gold);
            color: #080808;
            border-color: var(--gold);
            font-weight: 500;
        }

        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            min-height: 250px;
        }

        .wallpaper-card {
            background: var(--card);
            border: 1px solid #272727;
            border-radius: 16px;
            overflow: hidden;
            transition: .3s;
            animation: fadeIn .35s ease;
        }

        .wallpaper-card:hover {
            transform: translateY(-6px);
            border-color: var(--gold);
            box-shadow: 0 18px 50px rgba(0, 0, 0, .75);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-preview {
            height: 300px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #202020, #101010);
        }

        .card-preview img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            opacity: 0;
            transition: opacity .4s ease, transform .6s ease;
        }

        .card-preview img.loaded {
            opacity: 1;
        }

        .wallpaper-card:hover .card-preview img.loaded {
            transform: scale(1.04);
        }

        .image-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 13px;
        }

        .image-loading i {
            color: var(--gold);
            margin-right: 8px;
            animation: spin 1s linear infinite;
        }

        .image-error {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            color: #777;
            font-size: 13px;
            background: #181818;
        }

        .image-error i {
            color: #555;
            font-size: 30px;
        }

        .retry-btn {
            border: 1px solid #444;
            background: transparent;
            color: #aaa;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .retry-btn:hover {
            color: white;
            border-color: var(--gold);
        }

        .badge-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 13px;
            border-radius: 20px;
            background: rgba(0, 0, 0, .72);
            backdrop-filter: blur(6px);
            border: 1px solid #444;
            color: #ddd;
            font-size: 11px;
        }

        .badge-tag i {
            color: var(--gold);
            margin-right: 4px;
        }

        .resolution {
            position: absolute;
            right: 12px;
            bottom: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(0, 0, 0, .65);
            color: #aaa;
            border: 1px solid #333;
            font-size: 11px;
        }

        .card-info {
            padding: 14px 16px 18px;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .card-info h4 {
            font-size: 15px;
            font-weight: 400;
            color: #eee;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .download-btn {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #444;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            transition: .25s;
        }

        .download-btn:hover {
            color: white;
            border-color: var(--gold);
            background: rgba(184, 150, 107, .15);
        }

        .download-btn:disabled {
            opacity: .5;
            cursor: wait;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            color: #777;
            font-size: 12px;
        }

        .meta i {
            color: var(--gold);
            margin-right: 4px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            padding: 11px 20px;
            border-radius: 30px;
            background: rgba(25, 25, 25, .95);
            border: 1px solid #444;
            color: #ddd;
            font-size: 13px;
            transition: .3s;
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        footer {
            margin-top: 40px;
            padding-top: 26px;
            border-top: 1px solid #232323;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #666;
            font-size: 13px;
        }

        .footer-left {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .watermark i {
            color: var(--gold);
            margin-right: 4px;
        }

        .social a {
            color: #666;
            margin-left: 18px;
            font-size: 18px;
            transition: .25s;
        }

        .social a:hover {
            color: var(--gold);
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .top-bar { flex-direction: column; align-items: flex-start; }
            .brand { font-size: 23px; letter-spacing: 4px; }
            .sub { font-size: 10px; }
            .wallpaper-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
            .card-preview { height: 230px; }
            .card-info { padding: 11px; }
            .card-info h4 { font-size: 13px; }
            .download-btn { padding: 5px 8px; }
            .download-btn span { display: none; }
            footer { flex-direction: column; gap: 16px; text-align: center; }
        }

        @media (max-width: 480px) {
            .wallpaper-grid { gap: 10px; }
            .card-preview { height: 180px; }
            .badge-tag { top: 7px; left: 7px; }
            .resolution { right: 7px; bottom: 7px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="top-bar">
        <div class="logo-area">
            <span class="brand">黑丝·白丝</span>
            <span class="sub">高清壁纸 · 自动更新</span>
        </div>
        <div class="controls">
            <button id="refreshBtn">
                <i class="fas fa-sync-alt"></i>
                <span>换一批</span>
            </button>
            <label>
                <input type="checkbox" id="autoToggle" checked>
                自动更新
            </label>
        </div>
    </header>

    <nav class="category-tabs">
        <button class="tab active" data-cat="all">全部</button>
        <button class="tab" data-cat="黑丝">🖤 黑丝</button>
        <button class="tab" data-cat="白丝">🤍 白丝</button>
    </nav>

    <main id="gridContainer" class="wallpaper-grid"></main>

    <footer>
        <div class="footer-left">
            <span class="watermark"><i class="fas fa-building"></i>品质生活</span>
            <span><i class="fas fa-image"></i>随机壁纸</span>
            <span>© 2026 黑丝·白丝壁纸</span>
        </div>
        <div class="social">
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="Pinterest"><i class="fab fa-pinterest-p"></i></a>
            <a href="#" aria-label="WeChat"><i class="fab fa-weixin"></i></a>
            <a href="#" aria-label="Weibo"><i class="fab fa-weibo"></i></a>
        </div>
    </footer>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
    "use strict";

    const API_URLS = {
        "黑丝": "https://v2.xxapi.cn/api/heisi?return=302",
        "白丝": "https://v2.xxapi.cn/api/baisi?return=302"
    };

    const PER_CATEGORY = 6;
    const AUTO_INTERVAL = 15000;
    let currentCategory = "all";
    let autoTimer = null;
    let refreshing = false;

    const grid = document.getElementById("gridContainer");
    const refreshBtn = document.getElementById("refreshBtn");
    const autoToggle = document.getElementById("autoToggle");
    const tabs = document.querySelectorAll(".tab");
    const toast = document.getElementById("toast");

    let toastTimer = null;
    function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove("show");
        }, 2500);
    }

    function randomResolution() {
        const resolutions = ["2K", "3K", "4K", "5K"];
        return resolutions[Math.floor(Math.random() * resolutions.length)];
    }

    function randomLikes() {
        return Math.floor(Math.random() * 200) + 20;
    }

    function randomViews() {
        return Math.floor(Math.random() * 3000) + 500;
    }

    // 优化：加入 index 参数确保在同毫秒内批量生成的 URL 绝对不重复
    function getImageUrl(category, index) {
        const base = API_URLS[category];
        const random = Date.now() + "_" + index + "_" + Math.random().toString(36).substring(2, 8);
        return base + "&t=" + encodeURIComponent(random);
    }

    function createCard(category, index) {
        const id = Date.now() + "_" + index + "_" + Math.random().toString(36).substring(2, 8);
        const title = category + " · 风尚" + (index + 1);
        const imgUrl = getImageUrl(category, index);

        const card = document.createElement("div");
        card.className = "wallpaper-card";
        card.dataset.id = id;

        card.innerHTML = `
            <div class="card-preview">
                <div class="image-loading">
                    <i class="fas fa-spinner"></i>
                    正在加载
                </div>
                <img src="${imgUrl}" alt="${title}" loading="lazy" referrerpolicy="no-referrer">
                <div class="image-error">
                    <i class="fas fa-image"></i>
                    <span>图片加载失败</span>
                    <button class="retry-btn">重试</button>
                </div>
                <span class="badge-tag">
                    <i class="fas fa-tag"></i>
                    ${category}
                </span>
                <span class="resolution">
                    ${randomResolution()}
                </span>
            </div>
            <div class="card-info">
                <div class="title-row">
                    <h4>${title}</h4>
                    <button class="download-btn" type="button">
                        <i class="fas fa-download"></i>
                        <span>下载</span>
                    </button>
                </div>
                <div class="meta">
                    <span><i class="fas fa-eye"></i>${randomViews()}</span>
                    <span><i class="fas fa-heart"></i>${randomLikes()}</span>
                </div>
            </div>
        `;

        const img = card.querySelector("img");
        const loading = card.querySelector(".image-loading");
        const errorBox = card.querySelector(".image-error");
        const retryBtn = card.querySelector(".retry-btn");
        const downloadBtn = card.querySelector(".download-btn");

        img.addEventListener("load", function () {
            loading.style.display = "none";
            errorBox.style.display = "none";
            img.classList.add("loaded");
        });

        img.addEventListener("error", function () {
            loading.style.display = "none";
            img.classList.remove("loaded");
            errorBox.style.display = "flex";
        });

        retryBtn.addEventListener("click", function () {
            errorBox.style.display = "none";
            loading.style.display = "flex";
            img.classList.remove("loaded");
            img.src = getImageUrl(category, index);
        });

        downloadBtn.addEventListener("click", function () {
            downloadImage(img.src, title, downloadBtn);
        });

        return card;
    }

    async function render() {
        if (refreshing) return;
        refreshing = true;
        refreshBtn.classList.add("loading");
        grid.innerHTML = "";

        let categories = currentCategory === "all" ? ["黑丝", "白丝"] : [currentCategory];
        let index = 0;

        categories.forEach(category => {
            for (let i = 0; i < PER_CATEGORY; i++) {
                const card = createCard(category, index++);
                grid.appendChild(card);
            }
        });

        refreshing = false;
        refreshBtn.classList.remove("loading");
    }

    async function downloadImage(url, filename, button) {
        const original = button.innerHTML;
        button.disabled = true;
        button.innerHTML = `
            <i class="fas fa-spinner fa-spin"></i>
            <span>处理中</span>
        `;

        try {
            const response = await fetch(url, { mode: "cors" });
            if (!response.ok) throw new Error("HTTP " + response.status);

            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = blobUrl;
            link.download = filename + ".jpg";
            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => { URL.revokeObjectURL(blobUrl); }, 1000);
            showToast("图片下载成功");
        } catch (error) {
            console.warn("跨域限制，已转为直接打开原图:", error);
            showToast("受跨域限制，已为您新标签打开图片");
            window.open(url, "_blank", "noopener,noreferrer");
        } finally {
            button.disabled = false;
            button.innerHTML = original;
        }
    }

    function switchCategory(category) {
        currentCategory = category;
        tabs.forEach(tab => {
            tab.classList.toggle("active", tab.dataset.cat === category);
        });
        render();
    }

    function startAuto() {
        stopAuto();
        if (!autoToggle.checked) return;
        autoTimer = setInterval(() => {
            if (document.hidden) return;
            render();
        }, AUTO_INTERVAL);
    }

    function stopAuto() {
        if (autoTimer) {
            clearInterval(autoTimer);
            autoTimer = null;
        }
    }

    tabs.forEach(tab => {
        tab.addEventListener("click", () => {
            switchCategory(tab.dataset.cat);
        });
    });

    refreshBtn.addEventListener("click", () => {
        render();
    });

    autoToggle.addEventListener("change", () => {
        if (autoToggle.checked) {
            startAuto();
            showToast("自动更新已开启");
        } else {
            stopAuto();
            showToast("自动更新已关闭");
        }
    });

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            stopAuto();
        } else {
            if (autoToggle.checked) startAuto();
        }
    });

    switchCategory("all");
    startAuto();
})();
</script>
</body>
</html>
